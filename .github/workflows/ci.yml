name: checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b poppler-utils
      - name: Python dependencies
        run: pip install requests beautifulsoup4 lxml matplotlib jinja2 weasyprint openpyxl
      - name: Offline tests
        run: python -m unittest discover -s tests -v
